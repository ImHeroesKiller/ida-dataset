# Knowledge Acquisition System — Policies
# Human controller knobs. Nothing is hard-coded in pipeline code.

version: "1.0"

# Feature switches (human controller) — opened for continuous manufacturing
features:
  crawling_enabled: true
  extraction_enabled: true
  publishing_enabled: true

# Approval modes: automatic | semi_automatic | manual
# automatic = fill all datasheet tables without human gate (still provenance + schema)
approval_mode: automatic

# Whether every candidate requires human review before publish
review_required: false

# Confidence gate (0.0 – 1.0)
# Lowered so more grounded rows from free DDG sources can land.
confidence_threshold: 0.70

# Limits (safety rails only) — raised so multi-table datasheets can fill.
limits:
  max_documents: 2000
  max_rows_per_day: 2000
  max_updates_per_day: 1000
  max_sources_per_run: 120
  max_documents_per_session: 500

# Discovery strategy — DuckDuckGo free REST/HTML primary
# Search engines never become knowledge sources; trusted registry still gates domains.
discovery:
  primary_api: duckduckgo
  max_tavily_searches_per_session: 0
  max_ddg_searches_per_session: 40
  secondary_paid_api_fallback: false
  free_feeds_enabled: true
  # One discovery batch → route into ALL datasheet tables (not only one)
  one_discovery_multi_dataset: true
  source_strategy:
    - operator_selected
    - knowledge_gap
    - random_trusted

# Provenance is mandatory; these columns are always attached
provenance_fields:
  - source_id
  - source_url
  - retrieved_at
  - confidence
  - extraction_version
  - validation_status
  - reviewer
  - published_at

# Validation rules
validation:
  require_trusted_source: true
  reject_below_confidence: true
  reject_duplicates: true
  reject_schema_mismatch: true
  reject_missing_required_fields: true
  reject_broken_url: true
  reject_outdated: true
  reject_invalid_references: true
  outdated_after_days: 365
  required_fields:
    - entity_type
    - entity_id
    - source_id
    - source_url
    - retrieved_at
    - confidence
    - extraction_version

# Deduplication
deduplication:
  strategy: entity_key  # entity_key | fuzzy | hybrid
  fuzzy_threshold: 0.92
  key_fields:
    - entity_type
    - entity_id
  content_fields:
    - canonical_name

# Entity linking
entity_linking:
  enabled: true
  link_fields:
    - company_id
    - industry_id
    - product_id
    - opportunity_id
    - competitor_id
  unresolved_policy: flag  # flag | reject | leave

# Publishing
publishing:
  # schedule: immediate | daily | weekly | manual
  schedule: immediate
  target_root: domains
  mode: append_only
  preserve_ids: true
  create_git_diff: true
  generate_report: true
  never_overwrite: true

# Extraction
extraction:
  version: "0.2.0-multi-dataset"
  # backend: search_api uses discovery results; free DDG primary
  backend: search_api
  target_datasets:
    - industry_library
    - company_profile
    - product_catalog
    - service_library
    - pain_point_library
    - solution_library
    - framework_library
    - case_study_library
    - buyer_persona_library
    - decision_maker_library
    - regulation_library
    - risk_library
    - trend_library
    - competitor_library
    - opportunity_analysis
    - business_signal_library
    - discovery_question_library

# Paths (relative to repository root)
paths:
  automation_root: automation
  queue_pending: automation/queue/pending
  queue_approved: automation/queue/approved
  queue_rejected: automation/queue/rejected
  logs: automation/logs
  reports: automation/reports
  cache: automation/cache
  raw_documents: automation/raw_documents
  review: automation/review
  source_registry: metadata/source_registry.csv
  domains_root: domains

# Logging
logging:
  level: INFO
  format: json
  retain_days: 90
