name: IDA Controlled Dataset Audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'automation/audit/**'
      - '.github/workflows/controlled-dataset-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run non-destructive dataset audit
        run: python automation/audit/controlled_clean.py
      - uses: actions/upload-artifact@v4
        with:
          name: ida-dataset-audit
          path: audit-output/
          retention-days: 30
